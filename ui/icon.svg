<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- Terminal window frame -->
  <rect x="3" y="3.5" width="18" height="17" rx="4" stroke="currentColor" stroke-width="1.6"/>

  <!-- Title bar separator + status dots -->
  <line x1="3" y1="7.5" x2="21" y2="7.5" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <circle cx="6.2" cy="5.5" r="0.9" fill="currentColor" opacity="0.6"/>
  <circle cx="8.4" cy="5.5" r="0.9" fill="currentColor" opacity="0.35"/>

  <!-- Kiro-like friendly face inside the screen -->
  <circle cx="9.7" cy="11" r="0.95" fill="currentColor"/>
  <circle cx="14.3" cy="11" r="0.95" fill="currentColor"/>
  <path d="M10.3 13.2 Q12 14.8 13.7 13.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Prompt caret + output line -->
  <path d="M7.3 16.7 L8.8 17.8 L7.3 18.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="9.8" y1="17.8" x2="13" y2="17.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
</svg>
